name: 智能整理一个网址
description: 提交公开可访问的资料，由 AI 生成说明、分类和标签的审核请求
title: "[收纳] "
labels:
  - inbox
body:
  - type: markdown
    attributes:
      value: |
        提交后，智能整理工作流将生成摘要、分类和标签，并创建一个待你审核的 Pull Request。合并后，该网址及整理出的摘要会公开展示在 Html Navi 站点中。
        请勿提交含有登录凭据、Token、私钥、个人隐私或仅限内部访问的链接。
  - type: input
    id: url
    attributes:
      label: 网址
      description: 请填写无需登录即可访问的公开网址。
      placeholder: https://example.com/article
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 你的备注
      description: 可选。你为什么觉得它值得收纳，或者希望未来在哪种场景下找到它？
      placeholder: 它解决了什么问题，适合谁阅读，或者值得重点关注的部分。
  - type: dropdown
    id: interest
    attributes:
      label: 初步方向
      description: 不确定时选择“待判断”，整理时会重新分类。
      options:
        - 待判断
        - 技术与工具
        - 学习与研究
        - 产品与设计
        - 写作与创作
        - 生活与兴趣
    validations:
      required: true
  - type: checkboxes
    id: public_confirmation
    attributes:
      label: 公开与安全确认
      options:
        - label: 我确认该网址适合公开保存，且内容中不包含我需要保密的凭据或隐私信息。
          required: true
